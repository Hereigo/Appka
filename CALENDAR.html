<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar</title>
  <style>
    :root {
      --gap: 0.5rem;
      --border: #d8dde6;
      --muted: #9aa3b0;
      --accent: #2563eb;
      --surface: #ffffff;
      --bg: #f4f6fa;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: #1f2733;
      font: 16px/1.45 system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .page {
      min-height: 100%;
      display: grid;
      grid-template-columns: 1fr 15%;
      grid-template-rows: auto 1fr;
      grid-template-areas:
        "header header"
        "main   sidebar";
      gap: var(--gap);
      padding: var(--gap);
    }

    .site-header {
      grid-area: header;
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 1.1rem;
      line-height: 1;
      white-space: nowrap;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .site-header h1 {
      margin: 0;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: clamp(0.6rem, 1vw, 0.72rem);
    }

    .month-nav {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .month-nav button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 5px;
      padding: 0 0.3rem;
      font-size: 0.65rem;
      line-height: 1.2;
    }

    .month-nav button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    #monthLabel {
      min-width: 11ch;
      text-align: center;
      font-weight: 600;
      font-size: 0.65rem;
    }

    .sidebar {
      grid-area: sidebar;
      min-width: 0;
      padding: 0.5rem 0.375rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .sidebar h2 {
      margin: 0 0 0.5rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .sidebar ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 0.4rem;
      font-size: 0.85rem;
      word-break: break-word;
    }

    .main {
      grid-area: main;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: var(--gap);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .calendar {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      grid-template-rows: auto repeat(6, minmax(3.5rem, 1fr));
      gap: 2px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .calendar .weekday {
      background: #eef2f8;
      padding: 0.5rem 0.25rem;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #55617a;
    }

    .calendar .day {
      background: var(--surface);
      padding: 0.35rem 0.45rem;
      min-width: 0;
    }

    .calendar .day .num {
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
    }

    .calendar .day.outside .num {
      color: var(--muted);
    }

    .calendar .day.today {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .calendar .day.today .num {
      display: inline-grid;
      place-items: center;
      width: 1.6rem;
      height: 1.6rem;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .page {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto 1fr;
        grid-template-areas:
          "header"
          "sidebar"
          "main";
      }

      .calendar {
        grid-template-rows: auto repeat(6, minmax(2.75rem, 1fr));
      }

      .calendar .weekday span:last-child {
        display: none;
      }

      .sidebar ul {
        grid-auto-flow: column;
        grid-auto-columns: max-content;
        overflow-x: auto;
      }
    }

    @media (min-width: 769px) {
      .calendar .weekday span:first-child {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="site-header">
      <h1>Calendar</h1>
      <nav class="month-nav">
        <button type="button" id="prevMonth" aria-label="Previous month">&#8592;</button>
        <span id="monthLabel"></span>
        <button type="button" id="nextMonth" aria-label="Next month">&#8594;</button>
      </nav>
    </header>

    <aside class="sidebar">
      <h2>Links</h2>
      <ul>
        <li><a href="#">Today</a></li>
        <li><a href="#">Tasks</a></li>
        <li><a href="#">Notes</a></li>
        <li><a href="#">Settings</a></li>
      </ul>
    </aside>

    <main class="main">
      <div class="calendar" id="calendar" role="grid" aria-labelledby="monthLabel"></div>
    </main>
  </div>

  <script>
    (function () {
      const WEEKDAYS = [
        ["M", "Monday"], ["T", "Tuesday"], ["W", "Wednesday"],
        ["T", "Thursday"], ["F", "Friday"], ["S", "Saturday"], ["S", "Sunday"]
      ];
      const calendar = document.getElementById("calendar");
      const monthLabel = document.getElementById("monthLabel");
      const today = new Date();
      let view = new Date(today.getFullYear(), today.getMonth(), 1);

      function render() {
        monthLabel.textContent = view.toLocaleDateString(undefined, { month: "long", year: "numeric" });
        calendar.replaceChildren();

        for (const [short, full] of WEEKDAYS) {
          const cell = document.createElement("div");
          cell.className = "weekday";
          cell.setAttribute("role", "columnheader");
          cell.innerHTML = `<span>${short}</span><span>${full.slice(0, 3)}</span>`;
          calendar.append(cell);
        }

        // Grid starts on Monday of the week containing the 1st.
        const offset = (view.getDay() + 6) % 7;
        const start = new Date(view.getFullYear(), view.getMonth(), 1 - offset);

        for (let i = 0; i < 42; i++) {
          const date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
          const cell = document.createElement("div");
          cell.className = "day";
          cell.setAttribute("role", "gridcell");
          if (date.getMonth() !== view.getMonth()) cell.classList.add("outside");
          if (date.toDateString() === today.toDateString()) cell.classList.add("today");
          const num = document.createElement("span");
          num.className = "num";
          num.textContent = date.getDate();
          cell.append(num);
          calendar.append(cell);
        }
      }

      document.getElementById("prevMonth").addEventListener("click", () => {
        view = new Date(view.getFullYear(), view.getMonth() - 1, 1);
        render();
      });
      document.getElementById("nextMonth").addEventListener("click", () => {
        view = new Date(view.getFullYear(), view.getMonth() + 1, 1);
        render();
      });

      render();
    })();
  </script>
</body>

</html>
